    name: rhobs-gateway
    namespace: rhobs-production
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: rhobs
      app.kubernetes.io/name: rhobs-gateway
      app.kubernetes.io/part-of: rhobs
      app.kubernetes.io/version: 9aada65247a07782465beb500323a0e18d7e3d05
    name: rhobs-gateway
    namespace: rhobs-production
  spec:
    replicas: 2
    selector:
      matchLabels:
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: rhobs
        app.kubernetes.io/name: rhobs-gateway
        app.kubernetes.io/part-of: rhobs
    strategy:
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
      type: RollingUpdate
    template:
      metadata:
        labels:
          app.kubernetes.io/component: api
          app.kubernetes.io/instance: rhobs
          app.kubernetes.io/name: rhobs-gateway
          app.kubernetes.io/part-of: rhobs
          app.kubernetes.io/version: 9aada65247a07782465beb500323a0e18d7e3d05
      spec:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                    - rhobs-gateway
                topologyKey: kubernetes.io/hostname
              weight: 100
        containers:
        - args:
          - --web.listen=0.0.0.0:8080
          - --web.internal.listen=0.0.0.0:8081
          - --log.level=debug
          - --metrics.alertmanager.endpoint=http://alertmanager.rhobs-production.svc.cluster.local:9093
          - --rbac.config=/etc/observatorium/rbac.yaml
          - --tenants.config=/etc/observatorium/tenants.yaml
          - --server.read-timeout=5m
          - --metrics.read.endpoint=http://thanos-query-frontend-rhobs.rhobs-production.svc.cluster.local:9090
          - --metrics.write.endpoint=http://thanos-receive-router-rhobs.rhobs-production.svc.cluster.local:19291
          - --metrics.status.endpoint=http://thanos-query-rhobs.rhobs-production.svc.cluster.local:9090
          image: quay.io/redhat-services-prod/rhobs-mco-tenant/rhobs-observatorium-api:9fc0a6990fbc9cdcd81a69fc97aba8c3ccd66f8c
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /live
              port: 8081
              scheme: HTTP
            periodSeconds: 30
          name: observatorium-api
          ports:
          - containerPort: 8090
            name: grpc-public
          - containerPort: 8081
            name: internal
          - containerPort: 8080
            name: public
          readinessProbe:
            failureThreshold: 12
            httpGet:
              path: /ready
              port: 8081
              scheme: HTTP
            periodSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 100Mi
          volumeMounts:
          - mountPath: /etc/observatorium/rbac.yaml
            name: rbac
            readOnly: true
            subPath: rbac.yaml
          - mountPath: /etc/observatorium/tenants.yaml
            name: tenants
            readOnly: true
            subPath: tenants.yaml
        serviceAccountName: rhobs-gateway
        volumes:
        - configMap:
            name: rhobs-gateway
          name: rbac
        - name: tenants
          secret:
            secretName: rhobs-gateway
  status: {}
