apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: thanos-rhobs
objects:
- apiVersion: monitoring.thanos.io/v1alpha1
  kind: ThanosStore
  metadata:
    name: default
    namespace: rhobs-int
  spec:
    additionalArgs:
    - |-
      --tracing.config="config":
        "sampler_param": 2
        "sampler_type": "ratelimiting"
        "service_name": "thanos-store"
      "type": "JAEGER"
    additionalContainers:
    - args:
      - --reporter.grpc.host-port=dns:///otel-trace-writer-collector-headless.observatorium-tools.svc:14250
      - --reporter.type=grpc
      - --agent.tags=pod.namespace=$(NAMESPACE),pod.name=$(POD)
      env:
      - name: NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: POD
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      image: registry.redhat.io/rhosdt/jaeger-agent-rhel8:1.57.0-10
      imagePullPolicy: IfNotPresent
      livenessProbe:
        failureThreshold: 5
        httpGet:
          path: /
          port: 14271
          scheme: HTTP
        initialDelaySeconds: 1
      name: jaeger-agent
      ports:
      - containerPort: 5778
        name: configs
      - containerPort: 6831
        name: jaeger-thrift
      - containerPort: 14271
        name: metrics
      readinessProbe:
        httpGet:
          path: /
          port: 14271
          scheme: HTTP
        initialDelaySeconds: 1
      resources:
        limits:
          cpu: 128m
          memory: 128Mi
        requests:
          cpu: 32m
          memory: 64Mi
    baseImage: quay.io/redhat-services-prod/rhobs-mco-tenant/rhobs-thanos
    blockConfig:
      blockDiscoveryStrategy: concurrent
      blockFilesConcurrency: 1
      blockMetaFetchConcurrency: 32
    cachingBucketConfig:
      externalCacheConfig:
        key: thanos.yaml
        name: thanos-bucket-cache-memcached
    featureGates:
      serviceMonitor:
        enable: false
    ignoreDeletionMarksDelay: 24h
    imagePullPolicy: IfNotPresent
    indexCacheConfig:
      externalCacheConfig:
        key: thanos.yaml
        name: thanos-index-cache-memcached
    indexHeaderConfig:
      enableLazyReader: true
      lazyDownloadStrategy: lazy
      lazyReaderIdleTimeout: 5m
    logFormat: logfmt
    logLevel: info
    objectStorageConfig:
      key: thanos.yaml
      name: default-thanos-bucket
      optional: false
    replicas: 1
    resourceRequirements:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    shardingStrategy:
      shards: 1
      type: block
    storage:
      size: 10Gi
    storeLimitsOptions: {}
    timeRangeConfig:
      maxTime: -22h
    version: 358a4a4341684ca1f199b6780891f4d09d5ca458
  status: {}
- apiVersion: monitoring.thanos.io/v1alpha1
  kind: ThanosCompact
  metadata:
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: compact-tls
      serviceaccounts.openshift.io/oauth-redirectreference.application: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"thanos-compact-rhobs"}}'
    name: rhobs
    namespace: rhobs-int
  spec:
    additionalArgs:
    - --deduplication.replica-label=replica
    - |-
      --tracing.config="config":
        "sampler_param": 2
        "sampler_type": "ratelimiting"
        "service_name": "thanos-compact"
      "type": "JAEGER"
    additionalContainers:
    - args:
      - --reporter.grpc.host-port=dns:///otel-trace-writer-collector-headless.observatorium-tools.svc:14250
      - --reporter.type=grpc
      - --agent.tags=pod.namespace=$(NAMESPACE),pod.name=$(POD)
      env:
      - name: NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: POD
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      image: registry.redhat.io/rhosdt/jaeger-agent-rhel8:1.57.0-10
      imagePullPolicy: IfNotPresent
      livenessProbe:
        failureThreshold: 5
        httpGet:
          path: /
          port: 14271
          scheme: HTTP
        initialDelaySeconds: 1
      name: jaeger-agent
      ports:
      - containerPort: 5778
        name: configs
      - containerPort: 6831
        name: jaeger-thrift
      - containerPort: 14271
        name: metrics
      readinessProbe:
        httpGet:
          path: /
          port: 14271
          scheme: HTTP
        initialDelaySeconds: 1
      resources:
        limits:
          cpu: 128m
          memory: 128Mi
        requests:
          cpu: 32m
          memory: 64Mi
    - args:
      - -provider=openshift
      - -https-address=:8443
      - -http-address=
      - -email-domain=*
      - -upstream=http://localhost:10902
      - -openshift-service-account=thanos-compact-rhobs
      - '-openshift-sar={"resource": "namespaces", "verb": "get", "name": "rhobs-int",
        "namespace": "rhobs-int"}'
      - '-openshift-delegate-urls={"/": {"resource": "namespaces", "verb": "get",
        "name": "rhobs-int", "namespace": "rhobs-int"}}'
      - -tls-cert=/etc/tls/private/tls.crt
      - -tls-key=/etc/tls/private/tls.key
      - -client-secret-file=/var/run/secrets/kubernetes.io/serviceaccount/token
      - -cookie-secret=${OAUTH_PROXY_COOKIE_SECRET}
      - -openshift-ca=/etc/pki/tls/cert.pem
      - -openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      image: registry.redhat.io/openshift4/ose-oauth-proxy:v4.14
      name: oauth-proxy
      ports:
      - containerPort: 8443
        name: https
        protocol: TCP
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
      terminationMessagePolicy: FallbackToLogsOnError
      volumeMounts:
      - mountPath: /etc/tls/private
        name: tls
        readOnly: true
    additionalServicePorts:
    - name: https
      port: 8443
      targetPort: 8443
    additionalVolumes:
    - name: tls
      secret:
        secretName: compact-tls
    baseImage: quay.io/redhat-services-prod/rhobs-mco-tenant/rhobs-thanos
    compactConfig:
      compactConcurrency: 1
    debugConfig:
      acceptMalformedIndex: true
      haltOnError: true
      maxCompactionLevel: 3
    downsamplingConfig:
      disable: false
      downsamplingConcurrency: 1
    featureGates:
      serviceMonitor:
        enable: false
    imagePullPolicy: IfNotPresent
    logFormat: logfmt
    logLevel: info
    objectStorageConfig:
      key: thanos.yaml
      name: default-thanos-bucket
      optional: false
    resourceRequirements:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    retentionConfig:
      fiveMinutes: 365d
      oneHour: 365d
      raw: 365d
    storage:
      size: 10Gi
    version: 358a4a4341684ca1f199b6780891f4d09d5ca458
  status: {}
- apiVersion: monitoring.thanos.io/v1alpha1
  kind: ThanosQuery
  metadata:
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: query-frontend-tls
      serviceaccounts.openshift.io/oauth-redirectreference.application: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"thanos-query-frontend-rhobs"}}'
    name: rhobs
    namespace: rhobs-int
  spec:
    baseImage: quay.io/redhat-services-prod/rhobs-mco-tenant/rhobs-thanos
    customStoreLabelSelector:
      matchLabels:
        app.kubernetes.io/part-of: thanos
        operator.thanos.io/store-api: "true"
    featureGates:
      podDisruptionBudget:
        enable: false
      serviceMonitor:
        enable: false
    grpcProxyStrategy: lazy
    imagePullPolicy: IfNotPresent
    logFormat: logfmt
    logLevel: info
    queryFrontend:
      additionalContainers:
      - args:
        - -provider=openshift
        - -https-address=:8443
        - -http-address=
        - -email-domain=*
        - -upstream=http://localhost:9090
        - -openshift-service-account=thanos-query-frontend-rhobs
        - '-openshift-sar={"resource": "namespaces", "verb": "get", "name": "rhobs-int",
          "namespace": "rhobs-int"}'
        - '-openshift-delegate-urls={"/": {"resource": "namespaces", "verb": "get",
          "name": "rhobs-int", "namespace": "rhobs-int"}}'
        - -tls-cert=/etc/tls/private/tls.crt
        - -tls-key=/etc/tls/private/tls.key
        - -client-secret-file=/var/run/secrets/kubernetes.io/serviceaccount/token
        - -cookie-secret=${OAUTH_PROXY_COOKIE_SECRET}
        - -openshift-ca=/etc/pki/tls/cert.pem
        - -openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        image: registry.redhat.io/openshift4/ose-oauth-proxy:v4.14
        name: oauth-proxy
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /etc/tls/private
          name: tls
          readOnly: true
      additionalServicePorts:
      - name: https
        port: 8443
        targetPort: 8443
      additionalVolumes:
      - name: tls
        secret:
          secretName: query-frontend-tls
      baseImage: quay.io/redhat-services-prod/rhobs-mco-tenant/rhobs-thanos
      compressResponses: true
      imagePullPolicy: IfNotPresent
      labelsDefaultTimeRange: 336h
      labelsMaxRetries: 3
      labelsSplitInterval: 48h
      logFormat: logfmt
      logLevel: info
      logQueriesLongerThan: 10s
      queryLabelSelector:
        matchLabels:
          operator.thanos.io/query-api: "true"
      queryRangeMaxRetries: 3
      queryRangeResponseCacheConfig:
        externalCacheConfig:
          key: thanos.yaml
          name: thanos-query-range-cache-memcached
      queryRangeSplitInterval: 48h
      replicas: 1
      resourceRequirements:
        limits:
          cpu: 200m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
      version: 358a4a4341684ca1f199b6780891f4d09d5ca458
    replicaLabels:
    - prometheus_replica
    - replica
    - rule_replica
    replicas: 1
    resourceRequirements:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    telemetryQuantiles:
      duration:
      - "0.1"
      - "0.25"
      - "0.75"
      - "1.25"
      - "1.75"
      - "2.5"
      - "3"
      - "5"
      - "10"
      - "15"
      - "30"
      - "60"
      - "120"
    version: 358a4a4341684ca1f199b6780891f4d09d5ca458
    webConfig:
      prefixHeader: X-Forwarded-Prefix
  status:
    querierStatus:
      availableReplicas: 0
      readyReplicas: 0
      replicas: 0
      unavailableReplicas: 0
      updatedReplicas: 0
    queryFrontendStatus:
      availableReplicas: 0
      readyReplicas: 0
      replicas: 0
      unavailableReplicas: 0
      updatedReplicas: 0
