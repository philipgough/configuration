apiVersion: monitoring.thanos.io/v1alpha1
kind: ThanosStore
metadata:
  name: default
  namespace: rhobs-int
spec:
  additionalArgs:
  - |-
    --tracing.config="config":
      "sampler_param": 2
      "sampler_type": "ratelimiting"
      "service_name": "thanos-store"
    "type": "JAEGER"
  additionalContainers:
  - args:
    - --reporter.grpc.host-port=dns:///otel-trace-writer-collector-headless.observatorium-tools.svc:14250
    - --reporter.type=grpc
    - --agent.tags=pod.namespace=$(NAMESPACE),pod.name=$(POD)
    env:
    - name: NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: POD
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    image: registry.redhat.io/rhosdt/jaeger-agent-rhel8:1.57.0-10
    imagePullPolicy: IfNotPresent
    livenessProbe:
      failureThreshold: 5
      httpGet:
        path: /
        port: 14271
        scheme: HTTP
      initialDelaySeconds: 1
    name: jaeger-agent
    ports:
    - containerPort: 5778
      name: configs
    - containerPort: 6831
      name: jaeger-thrift
    - containerPort: 14271
      name: metrics
    readinessProbe:
      httpGet:
        path: /
        port: 14271
        scheme: HTTP
      initialDelaySeconds: 1
    resources:
      limits:
        cpu: 128m
        memory: 128Mi
      requests:
        cpu: 32m
        memory: 64Mi
  baseImage: quay.io/redhat-services-prod/rhobs-mco-tenant/rhobs-thanos
  blockConfig:
    blockDiscoveryStrategy: concurrent
    blockFilesConcurrency: 1
    blockMetaFetchConcurrency: 32
  cachingBucketConfig:
    externalCacheConfig:
      key: thanos.yaml
      name: thanos-bucket-cache-memcached
  featureGates:
    serviceMonitor:
      enable: false
  ignoreDeletionMarksDelay: 24h
  imagePullPolicy: IfNotPresent
  indexCacheConfig:
    externalCacheConfig:
      key: thanos.yaml
      name: thanos-index-cache-memcached
  indexHeaderConfig:
    enableLazyReader: true
    lazyDownloadStrategy: lazy
    lazyReaderIdleTimeout: 5m
  logFormat: logfmt
  logLevel: info
  objectStorageConfig:
    key: thanos.yaml
    name: default-thanos-bucket
    optional: false
  replicas: 1
  resourceRequirements:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  shardingStrategy:
    shards: 1
    type: block
  storage:
    size: 10Gi
  storeLimitsOptions: {}
  timeRangeConfig:
    maxTime: -22h
  version: 358a4a4341684ca1f199b6780891f4d09d5ca458
status: {}
